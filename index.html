  <style>
    :root {
      --ink: #0f1210;
      --glass: rgba(18, 22, 20, 0.48);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #f7f4ef;
      --muted: rgba(247, 244, 239, 0.68);
      --track: rgba(255, 255, 255, 0.22);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      font-family: "Figtree", sans-serif;
      color: var(--text);
      background: #0b100e;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0b100e;
      --scene-image: url("./assets/Kishore_Kumar.png");
      pointer-events: none;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -24px;
      z-index: 0;
      background-image: var(--scene-image);
      background-position: center;
      background-size: cover;
      filter: blur(18px) brightness(0.58);
      transform: scale(1.04);
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      object-fit: cover;
      object-position: center center;
      image-rendering: auto;
    }

    .scene-shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        180deg,
        rgba(8, 12, 10, 0.12) 0%,
        rgba(8, 12, 10, 0.02) 40%,
        rgba(8, 12, 10, 0.28) 100%
      );
    }

    .scene > *:not(.scene-bg):not(.scene-shade) {
      pointer-events: auto;
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      box-shadow: var(--shadow);
    }

    .top-bar {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      padding-top: max(1.1rem, env(safe-area-inset-top));
      padding-left: max(1.4rem, env(safe-area-inset-left));
      padding-right: max(1.4rem, env(safe-area-inset-right));
      pointer-events: none;
    }

    .pill {
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      background: rgba(8, 12, 10, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .clock {
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
    }

    .brand {
      position: absolute;
      left: 50%;
      transform: translate(-50%, 8px);
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      overflow: hidden;
      isolation: isolate;
      border-color: rgba(87, 183, 255, 0.65);
      box-shadow: 0 0 12px rgba(35, 149, 255, 0.42), inset 0 0 10px rgba(35, 149, 255, 0.12);
      text-shadow: 0 0 6px rgba(150, 225, 255, .35);
      animation: brandIn 700ms 180ms ease forwards, brandGlow 2.8s 1s ease-in-out infinite, brandTextPulse 3.2s 1s ease-in-out infinite, brandRadiance 3.8s 1s ease-in-out infinite;
    }

    .brand::after {
      content: "";
      position: absolute;
      inset: -80% auto -80% -35%;
      width: 24%;
      background: linear-gradient(90deg, transparent, rgba(137, 216, 255, 0.9), transparent);
      filter: blur(2px);
      transform: rotate(20deg) translateX(-240%);
      animation: brandSweep 2.8s 1.2s ease-in-out infinite;
      pointer-events: none;
    }

    .playlist-link {
      pointer-events: auto;
      text-decoration: none;
      transition: filter 140ms ease, transform 140ms ease, background 140ms ease;
    }

    .playlist-links {
      display: flex;
      gap: 0.45rem;
    }

    .playlist-link:hover {
      color: #fff;
      transform: translateY(-1px);
      background: #2498ff;
      border-color: rgba(160, 220, 255, .9);
      box-shadow: 0 0 16px rgba(36, 152, 255, .5);
    }

    .playlist-link:focus-visible {
      color: #fff;
      background: #2498ff;
      border-color: rgba(160, 220, 255, .9);
      box-shadow: 0 0 16px rgba(36, 152, 255, .5);
    }

    .player-dock {
      position: absolute;
      left: 50%;
      bottom: max(1.6rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 6;
      width: min(720px, calc(100% - 1.6rem));
      display: grid;
      gap: 0.55rem;
      opacity: 0;
      animation: dockIn 800ms 280ms ease forwards;
    }

    .playlist-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.45rem;
      align-items: center;
      padding: 0.4rem 0.4rem 0.4rem 0.85rem;
      border-radius: 999px;
    }

    .playlist-bar input[type="url"] {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      user-select: text;
      -webkit-user-select: text;
    }

    .playlist-bar input[type="url"]::placeholder {
      color: var(--muted);
    }

    .bar-btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .bar-btn:hover,
    .bar-btn:focus-visible {
      background: #2498ff;
      color: #fff;
      box-shadow: 0 0 16px rgba(36, 152, 255, .4);
    }

    .bar-btn:active { transform: scale(0.97); }

    .image-bar {
      display: flex;
      gap: 0.45rem;
      justify-content: flex-end;
    }

    .image-bar .bar-btn {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    /* "Reset image" now sits inline with the rest of the image-bar buttons
       (next to "Change image", "Load Hindi", "Load Bengali") and shares
       their default white pill look + hover effect, so it stays correctly
       placed and consistently styled on every breakpoint. */

    .image-bar label.bar-btn {
      display: inline-flex;
      align-items: center;
    }

    /* Wrappers so a small control can sit on top of "Change image" / "Load Hindi" / "Load Bengali" */
    .change-wrap,
    .hindi-wrap,
    .bengali-wrap {
      position: relative;
      display: inline-flex;
    }

    /* Tablet-only "Show Video" button (shown on top of Load Hindi, see tablet media query) */
    .tab-show-video { display: none; }

    /* Small round speaker sitting on top of the "Load Bengali" button */

    .speaker-btn {
      appearance: none;
      position: absolute;
      left: 50%;
      bottom: calc(100% + 0.4rem);
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      transition: background 140ms ease, color 140ms ease, box-shadow 140ms ease, opacity 140ms ease, transform 140ms ease;
    }

    .speaker-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .speaker-btn:hover:not(:disabled),
    .speaker-btn:focus-visible:not(:disabled) {
      background: #2498ff;
      color: #fff;
      box-shadow: 0 0 16px rgba(36, 152, 255, .4);
    }

    .speaker-btn:active:not(:disabled) { transform: translateX(-50%) scale(0.94); }

    /* Disabled while any music is playing */
    .speaker-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Disabled because this very track is playing */
    .speaker-btn.is-playing:disabled {
      opacity: 1;
      background: #2498ff;
      color: #fff;
      box-shadow: 0 0 16px rgba(36, 152, 255, .45);
    }

    .image-bar input[type="file"] {
      display: none;
    }

    .player {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.95rem;
      align-items: center;
      padding: 0.72rem 0.85rem 0.72rem 0.72rem;
      border-radius: 999px;
    }

    .art {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .art.is-spinning {
      animation: artSpin 8s linear infinite;
    }

    .meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      padding-right: 0.35rem;
    }

    .title,
    .artist {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .artist {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .progress-wrap {
      margin-top: 0.12rem;
    }

    .progress {
      position: relative;
      height: 4px;
      border-radius: 999px;
      background: var(--track);
      cursor: pointer;
      touch-action: none;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: #fff;
      pointer-events: none;
    }

    .progress-knob {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .progress:hover .progress-knob,
    .progress.is-dragging .progress-knob {
      opacity: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding-right: 0.2rem;
    }

    .ctrl {
      appearance: none;
      border: 0;
      background: transparent;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    .ctrl:hover,
    .ctrl:focus-visible {
      background: #2498ff;
      color: #fff;
      box-shadow: 0 0 14px rgba(36, 152, 255, .4);
    }
    .ctrl:active { transform: scale(0.94); }

    .ctrl svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .play {
      width: 42px;
      height: 42px;
      margin: 0 0.1rem;
      background: #fff;
      color: var(--ink);
      transition: background 180ms ease, color 180ms ease, filter 140ms ease;
    }

    .play:hover,
    .play:focus-visible,
    .play:active {
      background: #2498ff;
      color: #fff;
      box-shadow: 0 0 18px rgba(36, 152, 255, .45);
      filter: none;
    }

    .play.is-playing {
      background: #2498ff;
      color: #fff;
      box-shadow: 0 0 18px rgba(36, 152, 255, .45);
    }

    .play .icon-pause { display: none; }
    .play.is-playing .icon-play { display: none; }
    .play.is-playing .icon-pause { display: block; }

    /* Floating, draggable YouTube player */
    #yt-host {
      position: fixed !important;
      left: auto;
      top: 5.6rem;
      right: 1rem;
      bottom: auto;
      width: 320px !important;
      height: 180px !important;
      z-index: 20 !important;
      overflow: hidden !important;
      border-radius: 16px !important;
      border: 1px solid rgba(255,255,255,.2) !important;
      background: rgba(0,0,0,.62) !important;
      box-shadow: 0 22px 70px rgba(0,0,0,.48), 0 0 0 1px rgba(255,255,255,.04) inset !important;
      transition: left 520ms cubic-bezier(.22,1,.36,1), top 520ms cubic-bezier(.22,1,.36,1),
                  right 520ms cubic-bezier(.22,1,.36,1), bottom 520ms cubic-bezier(.22,1,.36,1),
                  width 420ms cubic-bezier(.22,1,.36,1), height 420ms cubic-bezier(.22,1,.36,1),
                  border-radius 420ms ease, box-shadow 420ms ease, opacity 260ms ease;
      touch-action: none;
      will-change: left, top, opacity, transform;
    }

    #yt-host.is-closing {
      opacity: 0;
      transform: scale(.96);
      pointer-events: none;
    }

    #yt-host.is-opening {
      opacity: 0;
      transform: scale(.96);
    }

    #yt-host.is-dragging {
      transition: none !important;
      cursor: grabbing !important;
      box-shadow: 0 28px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.1) inset !important;
    }

    #yt-host iframe {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
    }

    .yt-drag-handle {
      position: absolute;
      left: 0;
      top: 0;
      right: 44px;
      height: 34px;
      z-index: 4;
      cursor: grab;
      background: linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,0));
      border-radius: 16px 0 0 0;
      touch-action: none;
      animation: dragHandlePulse 1.6s ease-in-out infinite;
    }

    .yt-drag-handle::before {
      content: "⋮⋮  Drag player";
      position: absolute;
      left: 11px;
      top: 7px;
      color: rgba(255,255,255,.86);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
      animation: dragLabelPulse 1.6s ease-in-out infinite;
    }

    @keyframes dragHandlePulse {
      0%, 100% { box-shadow: inset 0 2px 8px rgba(36, 152, 255, .12); }
      50% { box-shadow: inset 0 2px 14px rgba(36, 152, 255, .62), 0 0 12px rgba(36, 152, 255, .45); }
    }

    @keyframes dragLabelPulse {
      0%, 100% { color: rgba(255,255,255,.86); text-shadow: 0 1px 3px #000; }
      50% { color: #9edfff; text-shadow: 0 0 8px rgba(36, 152, 255, .95); }
    }

    .yt-window-close {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 6;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(8,12,10,.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      font: inherit;
      font-size: 17px;
      line-height: 1;
      transition: transform 180ms ease, background 180ms ease, opacity 180ms ease;
      animation: iframeClosePulse 1.5s ease-in-out infinite;
    }

    .yt-window-close:hover,
    .yt-window-close:focus-visible { transform: scale(1.08); background: #2498ff; box-shadow: 0 0 16px rgba(36, 152, 255, .5); }
    .yt-window-close:active { transform: scale(.94); }

    @keyframes iframeClosePulse {
      0%, 100% { border-color: rgba(255,255,255,.2); box-shadow: 0 0 5px rgba(36, 152, 255, .3); }
      50% { border-color: rgba(130, 215, 255, .95); box-shadow: 0 0 18px rgba(36, 152, 255, .9); }
    }

    .github-link {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .5rem .75rem;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-size: .76rem;
      font-weight: 600;
      background: rgba(8,12,10,.62);
      border: 1px solid rgba(255,255,255,.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 12px 34px rgba(0,0,0,.3);
      transition: transform 180ms ease, background 180ms ease, opacity 260ms ease;
    }

    .github-link:hover,
    .github-link:focus-visible { transform: translateY(-2px); background: #2498ff; box-shadow: 0 0 16px rgba(36, 152, 255, .5); }
    .github-link svg { width: 18px; height: 18px; fill: currentColor; }

    .screen-open {
      display: none;
      position: fixed;
      right: calc(max(1rem, env(safe-area-inset-right)) + 6.4rem);
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 51;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      padding: .55rem .8rem;
      color: #fff;
      background: rgba(8,12,10,.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      font: inherit;
      font-size: .75rem;
      font-weight: 600;
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      transition: transform 180ms ease, background 180ms ease, opacity 260ms ease;
    }

    .screen-open:hover,
    .screen-open:focus-visible { transform: translateY(-2px); background: #2498ff; box-shadow: 0 0 16px rgba(36, 152, 255, .5); }

    @media (min-width: 761px) {
      .screen-open.is-video-closed {
        animation: showVideoGlow 1.4s ease-in-out infinite;
      }
    }

    @keyframes showVideoGlow {
      0%, 100% {
        background: rgba(8, 12, 10, .68);
        border-color: rgba(255, 255, 255, .22);
        box-shadow: 0 0 8px rgba(36, 152, 255, .35);
      }
      50% {
        background: #2498ff;
        border-color: rgba(170, 225, 255, .95);
        box-shadow: 0 0 24px rgba(36, 152, 255, .95);
      }
    }

    .mobile-show-video {
      display: none;
    }

    /* Hide mobile video arrow permanently */
    .mobile-video-arrow {
      display: none !important;
    }

    .screen-close,
    .screen-all {
      position: fixed;
      left: max(1rem, env(safe-area-inset-left));
      z-index: 51;
      border: 1px solid rgba(255,255,255,.22);
      color: #fff;
      background: rgba(8,12,10,.68);

    function updateResponsiveFavicon() {

      // Update all favicon links
      const faviconLinks = document.querySelectorAll('link[rel*="icon"]');
      faviconLinks.forEach(link => {
        if (link.rel.includes('icon')) {
          link.href = faviconPath;
        }
      });
      
      // Update apple-touch-icon
      const appleTouchIcons = document.querySelectorAll('link[rel="apple-touch-icon"]');
      appleTouchIcons.forEach(link => {
        link.href = faviconPath;
      });
      
      // Update Microsoft tile
      const tileImage = document.querySelector('meta[name="msapplication-TileImage"]');
      if (tileImage) {
        tileImage.content = faviconPath;
      }

      progress: $("progress"),
      progressFill: $("progressFill"),
      progressKnob: $("progressKnob"),
      play: $("play"),
      prev: $("prev"),
      next: $("next"),
      form: $("playlistForm"),
      input: $("playlistInput"),
      scene: document.querySelector(".scene"),
      mobileBgSource: $("mobileBgSource"),
      tabBgSource: $("tabBgSource"),
      sceneBg: $("sceneBg"),
      bgInput: $("bgInput"),
      loadHindi: $("loadHindi"),
      loadBengali: $("loadBengali"),
      speakerBtn: $("speakerBtn"),
      resetBg: $("resetBg"),
      ytHost: $("yt-host"),
      ytApiHost: $("yt-api-host"),
      ytDragHandle: $("ytDragHandle"),
      ytWindowClose: $("ytWindowClose"),
      screenClose: $("screenClose"),
      screenOpen: $("screenOpen"),
      screenAll: $("screenAll"),
      screenAllThumb: $("screenAllThumb"),
      mobileVideoArrow: $("mobileVideoArrow"),
      mobileShowVideo: $("mobileShowVideo"),
      tabShowVideo: $("tabShowVideo"),
      changeWrap: document.querySelector(".change-wrap"),
    };

    // Remember where "Reset image" lives in the markup (inside the main
    // Change image / Load Hindi / Load Bengali row) so it can be moved to
    // float above "Change image" on mobile and moved back for tablet/desktop.
    const resetBgHome = { parent: els.resetBg.parentElement, next: els.resetBg.nextSibling };

    let player = null;
    let ready = false;
    let seeking = false;
    let currentSource = { type: "playlist", id: DEFAULT_PLAYLIST };
    let pendingSource = null;
    let customBgUrl = null;
    // Playlist recovery state. YouTube can return 100/101/150 for individual
    // playlist items. We remember the failed index and move to the next item
    // instead of stopping the entire playlist.
    let playlistFailedIndexes = new Set();
    let playlistRecoveryTimer = null;
    let playlistLoadToken = 0;
    let wantPlay = false;
    let ytDrag = null;
    let ytPlayerClosed = false;
    let ytMoveFrame = 0;
    let ytPendingPosition = null;
    let ytWasOpenBeforeMinimal = null;
    let ytPositionBeforeMinimal = null;
    // Kishore Kumar mp3 (speaker button + play-on-refresh)
    let ytIsPlaying = false;
    let kishoreAudio = null;
    let reloadPlayPending = false;
    // Refresh flow: "intro" (playing Kishore_Kumar.mp3) -> "hindi" (autoplaying
    // the Hindi default playlist once the intro has finished).
    let reloadStage = "intro";
    let introAudio = null;
    let hindiAutoplayWhenReady = false;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function setYtPosition(x, y, smooth = true) {
      const rect = els.ytHost.getBoundingClientRect();
      const margin = 10;
      const maxX = Math.max(margin, window.innerWidth - rect.width - margin);
      const maxY = Math.max(margin, window.innerHeight - rect.height - margin);
      const nx = clamp(x, margin, maxX);
      const ny = clamp(y, margin, maxY);
      if (!smooth) els.ytHost.classList.add("is-dragging");
      els.ytHost.style.left = `${nx}px`;
      els.ytHost.style.top = `${ny}px`;
      els.ytHost.style.setProperty("--yt-left", `${nx}px`);
      els.ytHost.style.setProperty("--yt-top", `${ny}px`);
      els.ytHost.style.right = "auto";
      els.ytHost.style.bottom = "auto";
    }

    // Place the player at a position with no slide animation (used when
    // opening the player so it does not glide in from the corner).
    function placeYtInstant(x, y) {
      const prev = els.ytHost.style.transition;
      els.ytHost.style.transition = "none";
      setYtPosition(x, y, true);
      void els.ytHost.offsetWidth; // flush styles so the jump is not animated
      els.ytHost.style.transition = prev;
    }

    function updateMobileVideoArrow() {
      // Mobile arrow is now permanently hidden, no updates needed
      return;
    }

    // Which "Show Video" control is currently active for this screen size:
    // desktop/laptop's corner button, or (outside the minimized view)
    // tablet's/mobile's button that sits above "Load Hindi".
    function getShowVideoAnchor() {
      const isMinimal = document.body.classList.contains("is-minimal");
      if (window.innerWidth > 1024) return els.screenOpen;
      if (isMinimal) return els.screenOpen;
      return els.tabShowVideo;
    }

    // Moves the "Reset image" button so it floats above "Change image" on
    // mobile (matching how "Show Video" floats above "Load Hindi" there),
    // and keeps it in the normal button row on tablet/desktop.
    function positionResetButton() {
      if (!els.resetBg || !els.changeWrap) return;
      const isMobile = window.innerWidth <= 760;
      if (isMobile) {
        if (els.resetBg.parentElement !== els.changeWrap) {
          els.changeWrap.appendChild(els.resetBg);
        }
      } else if (els.resetBg.parentElement !== resetBgHome.parent) {
        resetBgHome.parent.insertBefore(els.resetBg, resetBgHome.next);
      }
    }

    function snapYtToNearestEdge() {
      const rect = els.ytHost.getBoundingClientRect();
      const margin = 14;
      const x = rect.left;
      const y = rect.top;
      const distances = {
        left: x,
        right: window.innerWidth - rect.right,
        top: y,
        bottom: window.innerHeight - rect.bottom,
      };
      const edge = Object.keys(distances).sort((a,b) => distances[a] - distances[b])[0];
      let targetX = x;
      let targetY = y;
      if (edge === "left") targetX = margin;
      if (edge === "right") targetX = window.innerWidth - rect.width - margin;
      if (edge === "top") targetY = margin;
      if (edge === "bottom") targetY = window.innerHeight - rect.height - margin;
      setYtPosition(targetX, targetY, true);
    }

    /* ===== Smooth drag (desktop mouse + mobile touch via Pointer Events) ===== */
    function startYtDrag(e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;

      const rect = els.ytHost.getBoundingClientRect();

      ytDrag = {
        pointerId: e.pointerId,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top
      };

      els.ytHost.classList.add("is-dragging");
      document.body.classList.add("dragging-video");
      els.ytHost.style.transition = "none";

      try {
        els.ytDragHandle.setPointerCapture(e.pointerId);
      } catch (err) {}

      e.preventDefault();
      e.stopPropagation();
    }

    function moveYtDrag(e) {
      if (!ytDrag || e.pointerId !== ytDrag.pointerId) return;

      ytPendingPosition = {
        x: e.clientX - ytDrag.offsetX,
        y: e.clientY - ytDrag.offsetY
      };

      if (!ytMoveFrame) {
        ytMoveFrame = requestAnimationFrame(() => {
          if (ytPendingPosition) {
            const rect = els.ytHost.getBoundingClientRect();
            const margin = 8;

            const maxX = Math.max(
              margin,
              window.innerWidth - rect.width - margin
            );

            const maxY = Math.max(
              margin,
              window.innerHeight - rect.height - margin
            );

            const x = clamp(ytPendingPosition.x, margin, maxX);
            const y = clamp(ytPendingPosition.y, margin, maxY);

            els.ytHost.style.left = `${x}px`;
            els.ytHost.style.top = `${y}px`;
            els.ytHost.style.right = "auto";
            els.ytHost.style.bottom = "auto";

            els.ytHost.style.setProperty("--yt-left", `${x}px`);
            els.ytHost.style.setProperty("--yt-top", `${y}px`);
          }

          ytPendingPosition = null;
          ytMoveFrame = 0;
        });
      }

      e.preventDefault();
      e.stopPropagation();
    }

    function endYtDrag(e) {
      if (!ytDrag || e.pointerId !== ytDrag.pointerId) return;

      if (ytMoveFrame) {
        cancelAnimationFrame(ytMoveFrame);
      }

      ytMoveFrame = 0;

      if (ytPendingPosition) {
        const rect = els.ytHost.getBoundingClientRect();
        const margin = 8;

        const maxX = Math.max(
          margin,
          window.innerWidth - rect.width - margin
        );

        const maxY = Math.max(
          margin,
          window.innerHeight - rect.height - margin
        );

        const x = clamp(ytPendingPosition.x, margin, maxX);
        const y = clamp(ytPendingPosition.y, margin, maxY);

        els.ytHost.style.left = `${x}px`;
        els.ytHost.style.top = `${y}px`;

        els.ytHost.style.setProperty("--yt-left", `${x}px`);
        els.ytHost.style.setProperty("--yt-top", `${y}px`);

        ytPendingPosition = null;
      }

      ytDrag = null;

      els.ytHost.classList.remove("is-dragging");
      document.body.classList.remove("dragging-video");

      // Re-enable smooth transition after dragging
      els.ytHost.style.transition = "";

      try {
        els.ytDragHandle.releasePointerCapture(e.pointerId);
      } catch (err) {}

      // Snap to nearest screen edge
      snapYtToNearestEdge();

      if (typeof updateMobileVideoArrow === "function") {
        updateMobileVideoArrow();
      }

      e.preventDefault();
      e.stopPropagation();
    }

    function minimizeInterface() {
      if (document.body.classList.contains("is-minimal")) return;
      ytWasOpenBeforeMinimal = !ytPlayerClosed && els.ytHost.style.display !== "none";
      if (ytWasOpenBeforeMinimal) {
        const rect = els.ytHost.getBoundingClientRect();
        ytPositionBeforeMinimal = { x: rect.left, y: rect.top };
        // Save the position in --yt-left / --yt-top so it can be restored and dragged later
        placeYtInstant(rect.left, rect.top);
      } else {
        ytPositionBeforeMinimal = null;
      }
      document.body.classList.add("is-minimal");
      if (ytWasOpenBeforeMinimal) closeYoutubeWindow();
      requestAnimationFrame(positionResetButton);
    }

    function restoreInterface() {
      document.body.classList.remove("is-minimal");
      requestAnimationFrame(positionResetButton);
    }

    function closeYoutubeWindow() {
      if (ytPlayerClosed) return;
      ytPlayerClosed = true;
      document.body.classList.remove("video-open");
      els.ytHost.classList.add("is-closing");
      els.ytHost.classList.remove("mobile-video-open"); // Remove mobile video open class
      els.screenOpen.classList.add("is-video-closed");
      els.screenOpen.textContent = "▶ Show video";
      els.tabShowVideo.classList.remove("is-video-open");
      els.tabShowVideo.classList.add("is-video-closed");
      els.tabShowVideo.textContent = "Show Video";
      updateMobileVideoArrow();
      requestAnimationFrame(positionResetButton);
      setTimeout(() => {
        if (!ytPlayerClosed) return;
        els.ytHost.style.display = "none";
        els.ytHost.classList.remove("is-closing");
      }, 260);
    }

    function openYoutubeWindow(position = null) {
      const host = els.ytHost;
      const isMobile = window.innerWidth <= 760;
      const prevTransition = host.style.transition;
      document.body.classList.add("video-open");

      // Lay the player out without animation so it never glides in from another spot
      host.style.transition = "none";

      // On mobile, add special class to show the video
      if (isMobile) {
        host.classList.add("mobile-video-open");
      }

      host.style.display = "block";
      ytPlayerClosed = false;
      host.classList.remove("is-closing");
      // Always let the JS-controlled --yt-left / --yt-top position win (also in the
      // minimal view), otherwise the minimal-view CSS pins the video and it cannot move.
      host.classList.add("is-position-restored", "is-mobile-open");
      els.screenOpen.classList.remove("is-video-closed");
      els.screenOpen.textContent = "↗ Open";
      els.tabShowVideo.classList.remove("is-video-closed");
      els.tabShowVideo.classList.add("is-video-open");

      // Position: explicit > last dragged position > default
      const rect = host.getBoundingClientRect();
      const lastLeft = parseFloat(host.style.getPropertyValue("--yt-left"));
      const lastTop = parseFloat(host.style.getPropertyValue("--yt-top"));
      const hasLast = Number.isFinite(lastLeft) && Number.isFinite(lastTop);
      let x;
      let y;
      if (position) {
        x = position.x;
        y = position.y;
      } else if (hasLast) {
        x = lastLeft;
        y = lastTop;
      } else if (isMobile) {
        x = (window.innerWidth - rect.width) / 2;
        y = (window.innerHeight - rect.height) / 2;
      } else {
        x = window.innerWidth - rect.width - 16;
        y = 5.6 * 16;
      }
      setYtPosition(x, y, true);
      void host.offsetWidth; // flush so the jump is not animated
      host.style.transition = prevTransition;

      host.classList.add("is-opening");
      requestAnimationFrame(() => {
        if (!position && !hasLast && !isMobile) {
          snapYtToNearestEdge();
        }
        requestAnimationFrame(() => host.classList.remove("is-opening"));
      });
      requestAnimationFrame(positionResetButton);
    }

    function openBgDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(BG_DB, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(BG_STORE)) {
            req.result.createObjectStore(BG_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function withBgStore(mode, run) {
      const db = await openBgDb();
      try {
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(BG_STORE, mode);
          const req = run(tx.objectStore(BG_STORE));
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => reject(req.error);
          tx.onerror = () => reject(tx.error);
        });
      } finally {
        db.close();
      }
    }

    const saveBgBlob = (blob) => withBgStore("readwrite", (s) => s.put(blob, "custom"));
    const loadBgBlob = () => withBgStore("readonly", (s) => s.get("custom"));
    const clearBgBlob = () => withBgStore("readwrite", (s) => s.delete("custom"));

    function setDefaultBackground() {
      if (customBgUrl) {
        URL.revokeObjectURL(customBgUrl);
        customBgUrl = null;
      }
      els.sceneBg.src = DEFAULT_BG;
      els.mobileBgSource.srcset = "./assets/Kishore_Kumar_mobile.png";
      els.tabBgSource.srcset = "./assets/Kishore_Kumar_tab.png";
      els.scene.style.setProperty("--scene-image", `url("${DEFAULT_BG}")`);
      els.resetBg.hidden = true;
    }

    function setCustomBackground(blob) {
      if (customBgUrl) URL.revokeObjectURL(customBgUrl);
      customBgUrl = URL.createObjectURL(blob);
      els.sceneBg.src = customBgUrl;
      els.mobileBgSource.srcset = customBgUrl;
      els.tabBgSource.srcset = customBgUrl;
      els.scene.style.setProperty("--scene-image", `url("${customBgUrl}")`);
      els.resetBg.hidden = false;
      requestAnimationFrame(positionResetButton);
    }

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, MAX_BG_EDGE / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(
            (blob) => (blob ? resolve(blob) : reject(new Error("compress failed"))),
            "image/jpeg",
            0.85
          );
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("invalid image"));
        };
        img.src = url;
      });
    }

    async function restoreCustomBackground() {
      try {
        const blob = await loadBgBlob();
        if (blob) setCustomBackground(blob);
        else setDefaultBackground();
      } catch {
        setDefaultBackground();
      }
    }

    function updateClock() {
      els.clock.textContent = new Date()
        .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
        .toLowerCase();
    }

    /* ===== Kishore Kumar mp3: speaker button + play on page refresh ===== */
    const RELOAD_GESTURE_EVENTS = ["pointerup", "touchend", "keydown", "click"];

    function isKishoreAudioPlaying() {
      return Boolean(kishoreAudio && !kishoreAudio.paused && !kishoreAudio.ended);
    }

    // The speaker is enabled only when no music is playing at all
    function updateSpeakerState() {
      const audioOn = isKishoreAudioPlaying();
      const busy = ytIsPlaying || audioOn;
      els.speakerBtn.disabled = busy;
      els.speakerBtn.classList.toggle("is-playing", audioOn);
      const label = audioOn
        ? "Kishore Kumar music is playing"
        : busy
          ? "Music is playing"
          : "Play Kishore Kumar music";
      els.speakerBtn.setAttribute("aria-label", label);
      els.speakerBtn.title = label;
    }

    function getKishoreAudio() {
      if (!kishoreAudio) {
        kishoreAudio = document.createElement("audio");
        kishoreAudio.preload = "auto";
        kishoreAudio.setAttribute("playsinline", "");
        KISHORE_AUDIO_SOURCES.forEach((src) => {
          const source = document.createElement("source");
          source.src = src;
          kishoreAudio.appendChild(source);
        });
        kishoreAudio.load();
        ["play", "playing", "pause", "ended", "error"].forEach((evt) =>
          kishoreAudio.addEventListener(evt, updateSpeakerState)
        );
      }
      return kishoreAudio;
    }

    function removeReloadGestureListeners() {
      RELOAD_GESTURE_EVENTS.forEach((evt) =>
        document.removeEventListener(evt, onReloadGesture, true)
      );
    }

    // Separate audio element for the refresh intro. Kept apart from the
    // speaker's kishoreAudio so the speaker button's file never changes.
    function getIntroAudio() {
      if (!introAudio) {
        introAudio = document.createElement("audio");
        introAudio.preload = "auto";
        introAudio.setAttribute("playsinline", "");
        introAudio.src = INTRO_AUDIO_SRC;
        introAudio.load();
        introAudio.addEventListener("ended", () => {
          if (!reloadPlayPending || reloadStage !== "intro") return;
          reloadStage = "hindi";
          attemptReloadStep();
        });
      }
      return introAudio;
    }

    function playIntroAudio() {
      const audio = getIntroAudio();
      try {
        return Promise.resolve(audio.play())
          .then(() => true)
          .catch((err) => {
            console.warn("Intro audio did not start:", err?.name || err);
            return false;
          });
      } catch {
        return Promise.resolve(false);
      }
    }

    function stopIntroAudio() {
      if (!introAudio) return;
      introAudio.pause();
      try { introAudio.currentTime = 0; } catch { /* ignore */ }
    }

    function cancelReloadPlay() {
      reloadPlayPending = false;
      hindiAutoplayWhenReady = false;
      removeReloadGestureListeners();
      stopIntroAudio();
    }

    // Stop the mp3 (used when a YouTube song starts)
    function stopKishoreAudio() {
      cancelReloadPlay();
      if (!kishoreAudio) return;
      kishoreAudio.pause();
      try { kishoreAudio.currentTime = 0; } catch { /* ignore */ }
      updateSpeakerState();
    }

    function playKishoreAudio() {
      if (ytIsPlaying) return Promise.resolve(false);
      const audio = getKishoreAudio();
      try {
        const result = audio.play();
        updateSpeakerState();
        return Promise.resolve(result)
          .then(() => true)
          .catch((err) => {
            console.warn("Kishore Kumar audio did not start:", err?.name || err);
            updateSpeakerState();
            return false;
          });
      } catch {
        updateSpeakerState();
        return Promise.resolve(false);
      }
    }

    // Runs the current refresh step: play the intro mp3 first, then (once it
    // has ended) autoplay the Hindi default playlist. If the browser blocks
    // either step, we wait for the visitor's next tap/click and retry the
    // same step — this covers desktop, mobile and tablet alike.
    function attemptReloadStep() {
      if (!reloadPlayPending) return;
      if (ytIsPlaying) {
        cancelReloadPlay();
        return;
      }

      if (reloadStage === "intro") {
        playIntroAudio().then((started) => {
          if (!started && reloadPlayPending) {
            RELOAD_GESTURE_EVENTS.forEach((evt) =>
              document.addEventListener(evt, onReloadGesture, true)
            );
          }
        });
        return;
      }

      // reloadStage === "hindi": hand off to the Hindi default playlist.
      if (player && ready) {
        currentSource = { type: "playlist", id: DEFAULT_PLAYLIST };
        els.input.value = DEFAULT_PLAYLIST_URL;
        rememberSource(currentSource, DEFAULT_PLAYLIST_URL);
        loadSource(currentSource, { autoplay: true });
        setTimeout(() => {
          if (!reloadPlayPending) return;
          if (ytIsPlaying) {
            cancelReloadPlay();
          } else if (wantPlay) {
            RELOAD_GESTURE_EVENTS.forEach((evt) =>
              document.addEventListener(evt, onReloadGesture, true)
            );
          }
        }, 900);
      } else {
        // YouTube's IFrame API is still loading — autoplay as soon as it is.
        hindiAutoplayWhenReady = true;
      }
    }

    // Browsers may block sound before the first tap/click. When that happens
    // after a refresh, playback resumes on the visitor's first interaction.
    function onReloadGesture(e) {
      if (!reloadPlayPending) {
        removeReloadGestureListeners();
        return;
      }
      if (ytIsPlaying) {
        cancelReloadPlay();
        return;
      }
      // The visitor is choosing something else (YouTube controls / speaker)
      if (e.target?.closest?.(".player, .playlist-bar, #yt-host, #speakerBtn")) return;
      removeReloadGestureListeners();
      attemptReloadStep();
    }

    function isPageReload() {
      try {
        const nav = performance.getEntriesByType("navigation")[0];
        if (nav) return nav.type === "reload";
      } catch { /* ignore */ }
      return performance.navigation?.type === 1;
    }

    // Kicks off the refresh flow: play Kishore_Kumar.mp3 first, then autoplay
    // the Hindi default playlist. Runs the same way on desktop, mobile and
    // tablet.
    function startReloadPlay() {
      reloadPlayPending = true;
      reloadStage = "intro";
      attemptReloadStep();
    }

    function setPlaying(isPlaying) {
      ytIsPlaying = isPlaying;
      els.play.classList.toggle("is-playing", isPlaying);
      els.play.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
      els.art.classList.toggle("is-spinning", isPlaying);
      els.screenAll.classList.toggle("is-playing", isPlaying);
      updateSpeakerState();
    }

    function setProgress(current, duration) {
      const pct = duration > 0 ? (current / duration) * 100 : 0;
      els.progressFill.style.width = `${pct}%`;
      els.progressKnob.style.left = `${pct}%`;
      els.progress.setAttribute("aria-valuenow", String(Math.round(pct)));
      els.screenAll.style.setProperty("--thumb-progress", `${pct}%`);
    }

    function cleanArtistName(name) {
      return String(name || "")
        .replace(/\s*-\s*Topic\s*$/i, "")
        .trim() || "YouTube Music";
    }

    function refreshMeta() {
      if (!player?.getVideoData) return;
      const data = player.getVideoData() || {};
      const title = data.title || "Untitled track";
      const artist = cleanArtistName(data.author);
      const videoId = data.video_id;

      els.title.textContent = title;
      els.artist.textContent = artist;
      document.title = `${title} · KISHOREVERSE`;

      if (videoId) {
        const thumbnail = `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`;
        els.art.src = thumbnail;
        els.screenAllThumb.src = thumbnail;
        els.art.alt = `Cover for ${title}`;
      }
    }

    function tick() {
      if (!player || seeking) return;
      setProgress(player.getCurrentTime?.() ?? 0, player.getDuration?.() ?? 0);
    }

    function seekFromClientX(clientX) {
      if (!player || !ready) return;
      const rect = els.progress.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const duration = player.getDuration?.() ?? 0;
      const target = duration * ratio;
      setProgress(target, duration);
      return target;
    }

    function playlistLength() {
      return player?.getPlaylist?.()?.length ?? 0;
    }

    function movePlaylist(step, attempt = 0) {
      if (!player || !ready || currentSource.type !== "playlist") return;
      const playlist = player.getPlaylist?.() || [];
      if (!playlist.length) {
        if (attempt < 10) {
          setTimeout(() => movePlaylist(step, attempt + 1), 300);
        } else {
          els.title.textContent = "Playlist is still loading…";
        }
        return;
      }

      const index = player.getPlaylistIndex?.() ?? 0;
      const nextIndex = (index + step + playlist.length) % playlist.length;
      wantPlay = true;
      stopKishoreAudio();
      player.playVideoAt(nextIndex);
      setTimeout(() => {
        if (wantPlay) tryPlay();
      }, 300);
    }

    function parseYouTubeInput(raw) {
      const value = String(raw || "").trim();
      if (!value) return null;
      if (/^(PL|OL|UU|LL|RD|SD)[\w-]{10,}$/i.test(value)) return { type: "playlist", id: value };
      if (/^[\w-]{11}$/.test(value)) return { type: "video", id: value };

      let url;
      try {
        url = new URL(value);
      } catch {
        return null;
      }

      const host = url.hostname.replace(/^www\./, "");
      const list = url.searchParams.get("list")?.trim();
      const video =
        url.searchParams.get("v") ||
        (host === "youtu.be" ? url.pathname.slice(1).split("/")[0] : null) ||
        (url.pathname.startsWith("/shorts/") ? url.pathname.split("/")[2] : null) ||
        (url.pathname.startsWith("/embed/") ? url.pathname.split("/")[2] : null);

      if (list && /^[\w-]{10,}$/.test(list)) return { type: "playlist", id: list };
      if (video && /^[\w-]{11}$/.test(video)) return { type: "video", id: video };
      return null;
    }

    function rememberSource(source, displayValue) {
      currentSource = source;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ source, displayValue }));
    }

    function showDetailedPlayError(code) {
      const reasons = {
        2: "The YouTube request is invalid",
        5: "The video cannot be played in this HTML5 player",
        100: "This playlist item is unavailable or private",
        101: "This playlist item does not allow embedding",
        150: "This playlist item does not allow embedding",
        153: "YouTube could not verify the video request",
      };
      const reason = reasons[code] || "YouTube did not provide a playback reason";
      const sourceLabel = currentSource.type === "playlist" ? "playlist" : "video";
      els.title.textContent = `Unable to load ${sourceLabel}`;
      els.artist.textContent = `${reason} (error ${code ?? "unknown"})`;
      setPlaying(false);
      wantPlay = false;
    }

    function showPlayError(code) {
      const blocked = code === 101 || code === 150;
      const unavailable = code === 100;
      els.title.textContent = blocked
        ? "Skipped a non-embeddable song"
        : unavailable
          ? "Skipped an unavailable song"
          : "Couldn’t play that link";
      els.artist.textContent = blocked || unavailable
        ? "KISHOREVERSE is trying the next song in this playlist…"
        : "Paste a public YouTube playlist or song URL";
      setPlaying(false);
    }

    function resetPlaylistRecovery() {
      playlistFailedIndexes.clear();
      if (playlistRecoveryTimer) {
        clearTimeout(playlistRecoveryTimer);
        playlistRecoveryTimer = null;
      }
    }

    function playlistCandidateIndexes(length, currentIndex) {
      const candidates = [];
      for (let offset = 1; offset <= length; offset += 1) {
        const candidate = (currentIndex + offset) % length;
        if (!playlistFailedIndexes.has(candidate)) candidates.push(candidate);
      }
      return candidates;
    }

    function recoverFromPlaylistError(code, failedIndex, token) {
      if (currentSource.type !== "playlist" || token !== playlistLoadToken) return false;

      const playlist = player?.getPlaylist?.() || [];
      const length = playlist.length;
      const index = Number.isInteger(failedIndex) && failedIndex >= 0 ? failedIndex : 0;
      playlistFailedIndexes.add(index);

      showPlayError(code);

      // Prefer playVideoAt() because it works with the playlist indices
      // returned by the IFrame API. Fall back to nextVideo() if YouTube has
      // not exposed the playlist array yet.
      if (length > 0) {
        const candidates = playlistCandidateIndexes(length, index);
        if (!candidates.length) {
          showDetailedPlayError(code);
          return false;
        }

        const nextIndex = candidates[0];
        playlistRecoveryTimer = setTimeout(() => {
          playlistRecoveryTimer = null;
          try {
            player.playVideoAt(nextIndex);
            if (wantPlay) {
              setTimeout(() => tryPlay(), 180);
            }
          } catch {
            try { player.nextVideo(); } catch { /* ignore */ }
          }
        }, 300);
        return true;
      }

      if (playlistFailedIndexes.size < 25) {
        playlistRecoveryTimer = setTimeout(() => {
          playlistRecoveryTimer = null;
          try {
            player.nextVideo();
            if (wantPlay) setTimeout(() => tryPlay(), 180);
          } catch { /* ignore */ }
        }, 300);
        return true;
      }

      showDetailedPlayError(code);
      return false;
    }

    function tryPlay() {
      if (!player || !ready) return;
      wantPlay = true;
      stopKishoreAudio(); // a YouTube song takes over from the mp3
      try {
        const state = player.getPlayerState();
        if (state === YT.PlayerState.CUED || state === YT.PlayerState.PAUSED || state === YT.PlayerState.UNSTARTED) {
          player.playVideo();
        } else if (state === YT.PlayerState.PLAYING) {
          /* already playing */
        } else {
          player.playVideo();
        }
      } catch {
        /* ignore */
      }
    }

    function loadSource(source, { autoplay = true } = {}) {
      if (!player || !ready) return false;

      playlistLoadToken += 1;
      resetPlaylistRecovery();
      wantPlay = autoplay;
      setProgress(0, 0);
      setPlaying(false);
      els.artist.textContent = "YouTube Music · Press Play to start";

      if (source.type === "playlist") {
        els.title.textContent = "Loading playlist…";
        const payload = {
          listType: "playlist",
          list: source.id,
        };
        try {
          if (autoplay) player.loadPlaylist(payload);
          else player.cuePlaylist(payload);
        } catch {
          if (autoplay) player.loadPlaylist(source.id);
          else player.cuePlaylist(source.id);
        }
        if (!autoplay) {
          setTimeout(() => {
            if (playlistLength() > 0) {
              try {
                player.playVideoAt(0);
                player.pauseVideo();
                refreshMeta();
                els.artist.textContent = "Ready · press ▶ Play";
              } catch { /* YouTube still loading */ }
            }
          }, 900);
        }
        if (autoplay) {
          // Start immediately from the user's Load/playlist-button gesture.
          // The delayed call is a fallback while YouTube finishes loading
          // the playlist metadata.
          tryPlay();
          setTimeout(() => {
            if (wantPlay) tryPlay();
          }, 900);
        }
        const loadToken = playlistLoadToken;
        setTimeout(() => {
          if (loadToken === playlistLoadToken && currentSource.id === source.id && els.title.textContent === "Loading playlist…") {
            showDetailedPlayError(2);
          }
        }, 10000);
      } else {
        els.title.textContent = "Loading song…";
        if (autoplay) player.loadVideoById(source.id);
        else player.cueVideoById(source.id);
      }

      return true;
    }

    function onPlayerReady() {
      ready = true;
      setInterval(tick, 250);

      if (hindiAutoplayWhenReady) {
        // The refresh intro (Kishore_Kumar.mp3) already finished before the
        // YouTube player was ready — hand off to the Hindi default playlist
        // now, with autoplay, exactly as it would have if the player had
        // been ready in time.
        hindiAutoplayWhenReady = false;
        currentSource = { type: "playlist", id: DEFAULT_PLAYLIST };
        els.input.value = DEFAULT_PLAYLIST_URL;
        rememberSource(currentSource, DEFAULT_PLAYLIST_URL);
        loadSource(currentSource, { autoplay: true });
        refreshMeta();
        tick();
        return;
      }

      if (pendingSource?.id) {
        currentSource = pendingSource;
        pendingSource = null;
        els.input.value = currentSource.id === BENGALI_PLAYLIST
          ? BENGALI_PLAYLIST_URL
          : DEFAULT_PLAYLIST_URL;
      } else {
        currentSource = { type: "playlist", id: DEFAULT_PLAYLIST };
        els.input.value = DEFAULT_PLAYLIST_URL;
      }

      // Cue the remembered/default playlist without starting playback.
      // Playback begins from the visible Play button, which is a direct user gesture.
      loadSource(currentSource, { autoplay: false });
      refreshMeta();
      tick();
    }

    function onPlayerStateChange(event) {
      const { PLAYING, PAUSED, ENDED, CUED, BUFFERING } = YT.PlayerState;

      if (event.data === PLAYING) {
        // A successful track means playlist recovery can start fresh.
        playlistFailedIndexes.clear();
        if (wantPlay) stopKishoreAudio();
        setPlaying(true);
        refreshMeta();
      } else if (event.data === PAUSED) {
        setPlaying(false);
      } else if (event.data === ENDED) {
        setPlaying(false);
        if (currentSource.type === "playlist" && playlistLength() > 0) {
          player.playVideoAt(0);
        } else if (currentSource.type === "video") {
          player.seekTo(0, true);
          player.playVideo();
        }
      } else if (event.data === CUED) {
        refreshMeta();
        tick();
        if (wantPlay) tryPlay();
      }
    }

    function onPlayerError(event) {
      const code = event?.data;
      const index = player.getPlaylistIndex?.() ?? 0;

      // 100 = unavailable/private, 101/150 = embedding disabled. These
      // errors can affect only one item in a playlist, so do not kill the
      // whole Bengali/Hindi playlist. Move forward until a playable item
      // is found.
      if (currentSource.type === "playlist" && [100, 101, 150].includes(code)) {
        recoverFromPlaylistError(code, index, playlistLoadToken);
        return;
      }

      showDetailedPlayError(code);
    }

    function createPlayer() {
      const playerVars = {
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        fs: 0,
        playsinline: 1,
        rel: 0,
        enablejsapi: 1,
        iv_load_policy: 3,
      };
      if (window.location.protocol.startsWith("http")) {
        playerVars.origin = window.location.origin;
        playerVars.widget_referrer = window.location.href;
      }

      player = new YT.Player("yt-api-host", {
        height: "180",
        width: "320",
        host: YOUTUBE_PLAYER_HOST,
        playerVars,
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
        },
      });
    }

    els.bgInput.addEventListener("change", async () => {
      const file = els.bgInput.files?.[0];
      els.bgInput.value = "";
      if (!file?.type.startsWith("image/")) return;
      try {
        const blob = await compressImageFile(file);
        await saveBgBlob(blob);
        setCustomBackground(blob);
      } catch {
        /* keep current background */
      }
    });

    els.resetBg.addEventListener("click", async () => {
      try { await clearBgBlob(); } catch { /* ignore */ }
      setDefaultBackground();
    });

    function loadNamedPlaylist(id, url, autoplay = false) {
      const source = { type: "playlist", id };
      els.input.value = url;
      rememberSource(source, url);
      if (!loadSource(source, { autoplay })) {
        pendingSource = source;
        els.title.textContent = "Loading playlist…";
        els.artist.textContent = "Starting the YouTube player";
      }
    }

    els.loadHindi.addEventListener("click", () => {
      loadNamedPlaylist(DEFAULT_PLAYLIST, DEFAULT_PLAYLIST_URL, false);
    });

    els.loadBengali.addEventListener("click", () => {
      loadNamedPlaylist(BENGALI_PLAYLIST, BENGALI_PLAYLIST_URL, false);
    });

    els.speakerBtn.addEventListener("click", () => {
      if (els.speakerBtn.disabled || ytIsPlaying) return;
      cancelReloadPlay();
      playKishoreAudio();
    });

    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const parsed = parseYouTubeInput(els.input.value);
      if (!parsed) {
        els.title.textContent = "Invalid YouTube link";
        els.artist.textContent = "Paste a playlist or song URL";
        return;
      }
      rememberSource(parsed, els.input.value.trim());
      if (!loadSource(parsed, { autoplay: false })) {
        els.title.textContent = "Player still loading…";
        els.artist.textContent = "Try again in a second";
      }
    });

    els.play.addEventListener("click", () => {
      if (!player || !ready) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        wantPlay = false;
        player.pauseVideo();
      } else {
        tryPlay();
      }
    });

    els.prev.addEventListener("click", () => {
      if (!player || !ready) return;
      if (currentSource.type !== "playlist") {
        player.seekTo(0, true);
        return;
      }
      movePlaylist(-1);
    });

    els.next.addEventListener("click", () => {
      if (!player || !ready) return;
      if (currentSource.type !== "playlist") {
        player.seekTo(0, true);
        player.playVideo();
        return;
      }
      movePlaylist(1);
    });

    els.progress.addEventListener("pointerdown", (e) => {
      if (!ready) return;
      els.progress.setPointerCapture(e.pointerId);
      seeking = true;
      els.progress.classList.add("is-dragging");
      seekFromClientX(e.clientX);
    });

    els.progress.addEventListener("pointermove", (e) => {
      if (seeking) seekFromClientX(e.clientX);
    });

    function endSeek(e) {
      if (!seeking) return;
      const target = seekFromClientX(e.clientX);
      if (typeof target === "number") player.seekTo(target, true);
      seeking = false;
      els.progress.classList.remove("is-dragging");
    }

    els.progress.addEventListener("pointerup", endSeek);
    els.progress.addEventListener("pointercancel", endSeek);

    els.progress.addEventListener("keydown", (e) => {
      if (!player || !ready) return;
      const duration = player.getDuration?.() ?? 0;
      const current = player.getCurrentTime?.() ?? 0;
      let next = current;
      if (e.key === "ArrowRight") next = Math.min(duration, current + 5);
      else if (e.key === "ArrowLeft") next = Math.max(0, current - 5);
      else return;
      e.preventDefault();
      player.seekTo(next, true);
      setProgress(next, duration);
    });

    // Video drag listeners (Pointer Events work for mouse, touch and pen)
    els.ytDragHandle.addEventListener("pointerdown", startYtDrag);
    els.ytDragHandle.addEventListener("pointermove", moveYtDrag);
    els.ytDragHandle.addEventListener("pointerup", endYtDrag);
    els.ytDragHandle.addEventListener("pointercancel", endYtDrag);

    els.ytWindowClose.addEventListener("click", closeYoutubeWindow);
    els.screenClose.addEventListener("click", minimizeInterface);
    els.mobileShowVideo.addEventListener("click", () => {
      if (ytPlayerClosed) openYoutubeWindow();
    });
    els.tabShowVideo.addEventListener("click", () => {
      if (ytPlayerClosed) openYoutubeWindow();
    });
    els.screenOpen.addEventListener("click", () => {
      if (ytPlayerClosed) openYoutubeWindow();
    });
    els.screenAll.addEventListener("click", () => {
      restoreInterface();
      if (ytWasOpenBeforeMinimal && ytPlayerClosed) {
        openYoutubeWindow();
      }
      ytWasOpenBeforeMinimal = null;
      ytPositionBeforeMinimal = null;
    });

    window.addEventListener("resize", () => {
      if (els.ytHost.style.display !== "none") snapYtToNearestEdge();
      positionResetButton();
    });

    // Ensure video is hidden by default on mobile
    function initializeMobileVideo() {
      if (window.innerWidth <= 760) {
        ytPlayerClosed = true;
        document.body.classList.remove("video-open");
        els.ytHost.style.display = "none";
        els.ytHost.classList.remove("mobile-video-open");
        if (els.tabShowVideo) {
          els.tabShowVideo.classList.add("is-video-closed");
          els.tabShowVideo.classList.remove("is-video-open");
          els.tabShowVideo.textContent = "Show Video";
        }
      }
    }

    restoreCustomBackground();
    updateClock();
    setInterval(updateClock, 15000);
    initializeMobileVideo(); // Initialize mobile video state
    updateSpeakerState();
    requestAnimationFrame(positionResetButton);
    
    // Initialize favicon
    updateResponsiveFavicon();
    
    if (isPageReload()) startReloadPlay(); // on refresh: play Kishore_Kumar.mp3, then autoplay the Hindi default playlist

    window.onYouTubeIframeAPIReady = createPlayer;
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  </script>
</body>
</html>
