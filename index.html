<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>KISHOREVERSE · Kishore Kumar Music</title>
  <link rel="icon" type="image/png" href="./assets/Kishore_Kumar.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1210;
      --glass: rgba(18, 22, 20, 0.48);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text: #f7f4ef;
      --muted: rgba(247, 244, 239, 0.68);
      --track: rgba(255, 255, 255, 0.22);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      font-family: "Figtree", sans-serif;
      color: var(--text);
      background: #0b100e;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0b100e;
      --scene-image: url("./assets/Kishore_Kumar.png");
      pointer-events: none;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: -24px;
      z-index: 0;
      background-image: var(--scene-image);
      background-position: center;
      background-size: cover;
      filter: blur(18px) brightness(0.58);
      transform: scale(1.04);
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      object-fit: cover;
      object-position: center center;
      image-rendering: auto;
    }

    .scene-shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        180deg,
        rgba(8, 12, 10, 0.12) 0%,
        rgba(8, 12, 10, 0.02) 40%,
        rgba(8, 12, 10, 0.28) 100%
      );
    }

    .scene > *:not(.scene-bg):not(.scene-shade) {
      pointer-events: auto;
    }

    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px) saturate(1.15);
      -webkit-backdrop-filter: blur(14px) saturate(1.15);
      box-shadow: var(--shadow);
    }

    .top-bar {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      padding-top: max(1.1rem, env(safe-area-inset-top));
      padding-left: max(1.4rem, env(safe-area-inset-left));
      padding-right: max(1.4rem, env(safe-area-inset-right));
      pointer-events: none;
    }

    .pill {
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      background: rgba(8, 12, 10, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .clock {
      font-size: 0.92rem;
      font-variant-numeric: tabular-nums;
    }

    .brand {
      position: absolute;
      left: 50%;
      transform: translate(-50%, 8px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      overflow: hidden;
      isolation: isolate;
      border-color: rgba(87, 183, 255, 0.65);
      box-shadow: 0 0 12px rgba(35, 149, 255, 0.42), inset 0 0 10px rgba(35, 149, 255, 0.12);
      animation: brandIn 700ms 180ms ease forwards, brandGlow 2.8s 1s ease-in-out infinite;
    }

    .brand::after {
      content: "";
      position: absolute;
      inset: -80% auto -80% -35%;
      width: 24%;
      background: linear-gradient(90deg, transparent, rgba(137, 216, 255, 0.9), transparent);
      filter: blur(2px);
      transform: rotate(20deg) translateX(-240%);
      animation: brandSweep 2.8s 1.2s ease-in-out infinite;
      pointer-events: none;
    }

    .playlist-link {
      pointer-events: auto;
      text-decoration: none;
      transition: filter 140ms ease, transform 140ms ease, background 140ms ease;
    }

    .playlist-links {
      display: flex;
      gap: 0.45rem;
    }

    .playlist-link:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
      background: rgba(8, 12, 10, 0.68);
    }

    .player-dock {
      position: absolute;
      left: 50%;
      bottom: max(1.6rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 6;
      width: min(720px, calc(100% - 1.6rem));
      display: grid;
      gap: 0.55rem;
      opacity: 0;
      animation: dockIn 800ms 280ms ease forwards;
    }

    .playlist-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.45rem;
      align-items: center;
      padding: 0.4rem 0.4rem 0.4rem 0.85rem;
      border-radius: 999px;
    }

    .playlist-bar input[type="url"] {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      user-select: text;
      -webkit-user-select: text;
    }

    .playlist-bar input[type="url"]::placeholder {
      color: var(--muted);
    }

    .bar-btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.45rem 0.85rem;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 140ms ease, transform 140ms ease;
    }

    .bar-btn:hover { filter: brightness(0.96); }
    .bar-btn:active { transform: scale(0.97); }

    .image-bar {
      display: flex;
      gap: 0.45rem;
      justify-content: flex-end;
    }

    .image-bar .bar-btn {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .image-bar .bar-btn.ghost {
      background: rgba(8, 12, 10, 0.55);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: none;
    }

    .image-bar label.bar-btn {
      display: inline-flex;
      align-items: center;
    }

    .image-bar input[type="file"] {
      display: none;
    }

    .player {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.95rem;
      align-items: center;
      padding: 0.72rem 0.85rem 0.72rem 0.72rem;
      border-radius: 999px;
    }

    .art {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .art.is-spinning {
      animation: artSpin 8s linear infinite;
    }

    .meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      padding-right: 0.35rem;
    }

    .title,
    .artist {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .artist {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .progress-wrap {
      margin-top: 0.12rem;
    }

    .progress {
      position: relative;
      height: 4px;
      border-radius: 999px;
      background: var(--track);
      cursor: pointer;
      touch-action: none;
    }

    .progress-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: #fff;
      pointer-events: none;
    }

    .progress-knob {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .progress:hover .progress-knob,
    .progress.is-dragging .progress-knob {
      opacity: 1;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding-right: 0.2rem;
    }

    .ctrl {
      appearance: none;
      border: 0;
      background: transparent;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    .ctrl:hover { background: rgba(255, 255, 255, 0.1); }
    .ctrl:active { transform: scale(0.94); }

    .ctrl svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .play {
      width: 42px;
      height: 42px;
      margin: 0 0.1rem;
      background: #fff;
      color: var(--ink);
    }

    .play:hover { filter: brightness(0.96); }
    .play .icon-pause { display: none; }
    .play.is-playing .icon-play { display: none; }
    .play.is-playing .icon-pause { display: block; }

    /* Floating, draggable YouTube player */
    #yt-host {
      position: fixed !important;
      left: auto;
      top: 5.6rem;
      right: 1rem;
      bottom: auto;
      width: 320px !important;
      height: 180px !important;
      z-index: 20 !important;
      overflow: hidden !important;
      border-radius: 16px !important;
      border: 1px solid rgba(255,255,255,.2) !important;
      background: rgba(0,0,0,.62) !important;
      box-shadow: 0 22px 70px rgba(0,0,0,.48), 0 0 0 1px rgba(255,255,255,.04) inset !important;
      transition: left 520ms cubic-bezier(.22,1,.36,1), top 520ms cubic-bezier(.22,1,.36,1),
                  right 520ms cubic-bezier(.22,1,.36,1), bottom 520ms cubic-bezier(.22,1,.36,1),
                  width 420ms cubic-bezier(.22,1,.36,1), height 420ms cubic-bezier(.22,1,.36,1),
                  border-radius 420ms ease, box-shadow 420ms ease, opacity 260ms ease;
      touch-action: none;
      will-change: left, top, opacity, transform;
    }

    #yt-host.is-closing {
      opacity: 0;
      transform: scale(.96);
      pointer-events: none;
    }

    #yt-host.is-opening {
      opacity: 0;
      transform: scale(.96);
    }

    #yt-host.is-dragging {
      transition: none !important;
      cursor: grabbing !important;
      box-shadow: 0 28px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.1) inset !important;
    }

    #yt-host iframe {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      border: 0 !important;
    }

    .yt-drag-handle {
      position: absolute;
      left: 0;
      top: 0;
      right: 44px;
      height: 34px;
      z-index: 4;
      cursor: grab;
      background: linear-gradient(180deg, rgba(0,0,0,.62), rgba(0,0,0,0));
      border-radius: 16px 0 0 0;
      touch-action: none;
    }

    .yt-drag-handle::before {
      content: "⋮⋮  Drag player";
      position: absolute;
      left: 11px;
      top: 7px;
      color: rgba(255,255,255,.86);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }

    .yt-window-close {
      position: absolute;
      top: 6px;
      right: 6px;
      z-index: 6;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(8,12,10,.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      font: inherit;
      font-size: 17px;
      line-height: 1;
      transition: transform 180ms ease, background 180ms ease, opacity 180ms ease;
    }

    .yt-window-close:hover { transform: scale(1.08); background: rgba(8,12,10,.9); }
    .yt-window-close:active { transform: scale(.94); }

    .github-link {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 50;
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .5rem .75rem;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-size: .76rem;
      font-weight: 600;
      background: rgba(8,12,10,.62);
      border: 1px solid rgba(255,255,255,.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 12px 34px rgba(0,0,0,.3);
      transition: transform 180ms ease, background 180ms ease, opacity 260ms ease;
    }

    .github-link:hover { transform: translateY(-2px); background: rgba(8,12,10,.78); }
    .github-link svg { width: 18px; height: 18px; fill: currentColor; }

    .screen-open {
      display: none;
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: calc(max(1rem, env(safe-area-inset-bottom)) + 3.25rem);
      z-index: 51;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      padding: .55rem .8rem;
      color: #fff;
      background: rgba(8,12,10,.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      font: inherit;
      font-size: .75rem;
      font-weight: 600;
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      transition: transform 180ms ease, background 180ms ease, opacity 260ms ease;
    }

    .screen-open:hover { transform: translateY(-2px); background: rgba(8,12,10,.82); }

    .screen-close,
    .screen-all {
      position: fixed;
      left: max(1rem, env(safe-area-inset-left));
      z-index: 51;
      border: 1px solid rgba(255,255,255,.22);
      color: #fff;
      background: rgba(8,12,10,.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      font: inherit;
      font-size: .75rem;
      font-weight: 600;
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      transition: transform 180ms ease, background 180ms ease;
    }

    .screen-close {
      bottom: max(1rem, env(safe-area-inset-bottom));
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 18px;
    }

    .screen-all {
      display: none;
      left: max(1rem, env(safe-area-inset-left)) !important;
      bottom: max(1rem, env(safe-area-inset-bottom));
      padding: .55rem .8rem;
      border-radius: 999px;
    }

    .screen-close:hover,
    .screen-all:hover { transform: translateY(-2px); background: rgba(8,12,10,.82); }

    body.is-minimal .top-bar .clock,
    body.is-minimal .top-bar .playlist-links,
    body.is-minimal .player-dock {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(10px);
    }

    .screen-open.is-video-closed { display: block; }

    body.is-minimal .screen-close { display: none; }
    body.is-minimal .screen-all { display: block; }

    body.is-minimal #yt-host {
      left: 50% !important;
      right: auto !important;
      top: auto !important;
      bottom: max(1rem, calc(env(safe-area-inset-bottom) + 1rem)) !important;
      transform: translateX(-50%);
      width: min(360px, calc(100vw - 1.5rem)) !important;
      height: min(202px, calc((100vw - 1.5rem) * .5625)) !important;
    }

    @media (max-width: 760px) {
      #yt-host {
        width: min(320px, calc(100vw - 1.5rem)) !important;
        height: min(180px, calc((100vw - 1.5rem) * .5625)) !important;
        top: auto;
        right: .75rem;
        bottom: 10.5rem;
      }

      body.is-minimal #yt-host {
        width: calc(100vw - 1rem) !important;
        height: calc((100vw - 1rem) * .5625) !important;
      }
    }

    @keyframes brandIn {
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @keyframes brandGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(35, 149, 255, 0.35), inset 0 0 8px rgba(35, 149, 255, 0.1); }
      50% { box-shadow: 0 0 22px rgba(35, 177, 255, 0.85), inset 0 0 14px rgba(35, 149, 255, 0.24); }
    }

    @keyframes brandSweep {
      0%, 18% { transform: rotate(20deg) translateX(-240%); opacity: 0; }
      35% { opacity: 1; }
      62%, 100% { transform: rotate(20deg) translateX(720%); opacity: 0; }
    }

    @keyframes dockIn {
      from { opacity: 0; transform: translateX(-50%) translateY(12px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @keyframes artSpin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 640px) {
      .scene-bg { object-position: center 38%; }

      .playlist-links { gap: 0.3rem; }
      .playlist-link { font-size: 0.68rem; padding: 0.3rem 0.45rem; }

      .top-bar {
        padding: 0.9rem;
        padding-top: max(0.9rem, env(safe-area-inset-top));
        padding-left: max(0.9rem, env(safe-area-inset-left));
        padding-right: max(0.9rem, env(safe-area-inset-right));
      }

      .brand {
        display: block;
        top: calc(max(0.9rem, env(safe-area-inset-top)) + 2.6rem);
        font-size: 0.68rem;
        padding: 0.3rem 0.55rem;
      }

      .player-dock {
        bottom: max(1rem, env(safe-area-inset-bottom));
        width: calc(100% - 1rem);
      }

      .playlist-bar { padding: 0.35rem 0.35rem 0.35rem 0.7rem; }
      .playlist-bar input[type="url"] { font-size: 0.74rem; }
      .bar-btn { padding: 0.4rem 0.7rem; }

      .image-bar { justify-content: stretch; }
      .image-bar .bar-btn {
        flex: 1;
        justify-content: center;
      }

      .player {
        grid-template-columns: auto 1fr;
        grid-template-areas:
          "art meta"
          "controls controls";
        border-radius: 28px;
        gap: 0.7rem;
        padding: 0.7rem;
      }

      .art {
        grid-area: art;
        width: 52px;
        height: 52px;
      }

      .meta { grid-area: meta; }

      .controls {
        grid-area: controls;
        justify-content: center;
        padding: 0.15rem 0 0.1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .brand,
      .player-dock {
        animation: none;
        opacity: 1;
      }

      .brand::after { animation: none; }

      .brand { transform: translate(-50%, 0); }
      .player-dock { transform: translateX(-50%); }
      .art.is-spinning { animation: none; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <picture>
      <source id="mobileBgSource" media="(max-width: 640px)" srcset="./assets/Kishore_Kumar_mobile.png" />
      <img class="scene-bg" id="sceneBg" src="./assets/Kishore_Kumar.png" width="1920" height="1080" alt="" draggable="false" />
    </picture>
    <div class="scene-shade" aria-hidden="true"></div>

    <header class="top-bar">
      <div class="pill clock" id="clock">--:--</div>
      <div class="pill brand">KISHOREVERSE</div>
      <div class="playlist-links">
        <a class="pill playlist-link" href="https://www.youtube.com/playlist?list=PLUhKXbPpN0vEc-btqPyLsgZN8sIj-6UHV" target="_blank" rel="noopener noreferrer">🎵 Hindi ↗</a>
        <a class="pill playlist-link" href="https://www.youtube.com/playlist?list=PLZxwXvsjsA8s" target="_blank" rel="noopener noreferrer">🎵 Bengali ↗</a>
      </div>
    </header>

    <div class="player-dock">
      <div class="image-bar">
        <label class="bar-btn">
          Change image
          <input id="bgInput" type="file" accept="image/*" />
        </label>
        <button class="bar-btn" id="loadHindi" type="button">Load Hindi</button>
        <button class="bar-btn" id="loadBengali" type="button">Load Bengali</button>
        <button class="bar-btn ghost" id="resetBg" type="button" hidden>Reset image</button>
      </div>

      <form class="playlist-bar glass" id="playlistForm" autocomplete="off">
        <input
          id="playlistInput"
          type="url"
          inputmode="url"
          spellcheck="false"
          placeholder="Paste YouTube / YT Music playlist or song URL"
          aria-label="YouTube playlist or song URL"
        />
        <button class="bar-btn" type="submit">Load</button>
      </form>

      <div class="player glass" role="region" aria-label="Music player">
        <img class="art" id="art" src="./assets/Kishore_Kumar.png" alt="Kishore Kumar" draggable="false" />
        <div class="meta">
          <div class="title" id="title">Kishore Kumar · Music Lives Forever</div>
          <div class="artist" id="artist">YouTube Music · Ads controlled by YouTube</div>
          <div class="progress-wrap">
            <div class="progress" id="progress" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
              <div class="progress-fill" id="progressFill"></div>
              <div class="progress-knob" id="progressKnob"></div>
            </div>
          </div>
        </div>
        <div class="controls">
          <button class="ctrl" id="prev" type="button" aria-label="Previous song">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button class="ctrl play" id="play" type="button" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
          </button>
          <button class="ctrl" id="next" type="button" aria-label="Next song">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="yt-host" aria-label="Movable YouTube player">
    <div id="yt-api-host"></div>
    <div class="yt-drag-handle" id="ytDragHandle" title="Drag the player to any side"></div>
    <button class="yt-window-close" id="ytWindowClose" type="button" aria-label="Close YouTube player">×</button>
  </div>

  <a class="github-link" href="https://github.com/bikram73/KISHOREVERSE" target="_blank" rel="noopener noreferrer" aria-label="Open KISHOREVERSE GitHub repository">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.33-1.77-1.33-1.77-1.09-.75.08-.74.08-.74 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.94 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.17.76.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.63-5.49 5.93.43.37.81 1.1.81 2.22v3.28c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"/></svg>
    <span>GitHub</span>
  </a>

  <button class="screen-close" id="screenClose" type="button" aria-label="Close everything except the background and branding">×</button>
  <button class="screen-open" id="screenOpen" type="button" aria-label="Show video">▶ Show video</button>
  <button class="screen-all" id="screenAll" type="button" aria-label="Show all interface controls">↗ Open all</button>

  <script>
    const DEFAULT_PLAYLIST = "PLUhKXbPpN0vEc-btqPyLsgZN8sIj-6UHV";
    const DEFAULT_PLAYLIST_URL = `https://www.youtube.com/playlist?list=${DEFAULT_PLAYLIST}`;
    const BENGALI_PLAYLIST = "PLZxwXvsjsA8s";
    const BENGALI_PLAYLIST_URL = `https://youtube.com/playlist?list=${BENGALI_PLAYLIST}`;
    const YOUTUBE_PLAYER_HOST = "https://www.youtube.com";
    const DEFAULT_BG = "./assets/Kishore_Kumar.png";
    const STORAGE_KEY = "kishoreverse-source";
    const BG_DB = "kishoreverse-bg";
    const BG_STORE = "background";
    const MAX_BG_EDGE = 1920;

    const $ = (id) => document.getElementById(id);
    const els = {
      clock: $("clock"),
      title: $("title"),
      artist: $("artist"),
      art: $("art"),
      progress: $("progress"),
      progressFill: $("progressFill"),
      progressKnob: $("progressKnob"),
      play: $("play"),
      prev: $("prev"),
      next: $("next"),
      form: $("playlistForm"),
      input: $("playlistInput"),
      scene: document.querySelector(".scene"),
      mobileBgSource: $("mobileBgSource"),
      sceneBg: $("sceneBg"),
      bgInput: $("bgInput"),
      loadHindi: $("loadHindi"),
      loadBengali: $("loadBengali"),
      resetBg: $("resetBg"),
      ytHost: $("yt-host"),
      ytApiHost: $("yt-api-host"),
      ytDragHandle: $("ytDragHandle"),
      ytWindowClose: $("ytWindowClose"),
      screenClose: $("screenClose"),
      screenOpen: $("screenOpen"),
      screenAll: $("screenAll"),
    };

    let player = null;
    let ready = false;
    let seeking = false;
    let currentSource = { type: "playlist", id: DEFAULT_PLAYLIST };
    let pendingSource = null;
    let customBgUrl = null;
    // Playlist recovery state. YouTube can return 100/101/150 for individual
    // playlist items. We remember the failed index and move to the next item
    // instead of stopping the entire playlist.
    let playlistFailedIndexes = new Set();
    let playlistRecoveryTimer = null;
    let playlistLoadToken = 0;
    let wantPlay = false;
    let ytDrag = null;
    let ytPlayerClosed = false;
    let ytMoveFrame = 0;
    let ytPendingPosition = null;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function setYtPosition(x, y, smooth = true) {
      const rect = els.ytHost.getBoundingClientRect();
      const margin = 10;
      const maxX = Math.max(margin, window.innerWidth - rect.width - margin);
      const maxY = Math.max(margin, window.innerHeight - rect.height - margin);
      const nx = clamp(x, margin, maxX);
      const ny = clamp(y, margin, maxY);
      if (!smooth) els.ytHost.classList.add("is-dragging");
      els.ytHost.style.left = `${nx}px`;
      els.ytHost.style.top = `${ny}px`;
      els.ytHost.style.right = "auto";
      els.ytHost.style.bottom = "auto";
    }

    function snapYtToNearestEdge() {
      const rect = els.ytHost.getBoundingClientRect();
      const margin = 14;
      const x = rect.left;
      const y = rect.top;
      const distances = {
        left: x,
        right: window.innerWidth - rect.right,
        top: y,
        bottom: window.innerHeight - rect.bottom,
      };
      const edge = Object.keys(distances).sort((a,b) => distances[a] - distances[b])[0];
      let targetX = x;
      let targetY = y;
      if (edge === "left") targetX = margin;
      if (edge === "right") targetX = window.innerWidth - rect.width - margin;
      if (edge === "top") targetY = margin;
      if (edge === "bottom") targetY = window.innerHeight - rect.height - margin;
      setYtPosition(targetX, targetY, true);
    }

    function startYtDrag(e) {
      if (e.button !== undefined && e.button !== 0) return;
      const rect = els.ytHost.getBoundingClientRect();
      ytDrag = { pointerId: e.pointerId, offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
      els.ytHost.classList.add("is-dragging");
      els.ytDragHandle.setPointerCapture?.(e.pointerId);
      e.preventDefault();
    }

    function moveYtDrag(e) {
      if (!ytDrag || e.pointerId !== ytDrag.pointerId) return;
      ytPendingPosition = { x: e.clientX - ytDrag.offsetX, y: e.clientY - ytDrag.offsetY };
      if (!ytMoveFrame) {
        ytMoveFrame = requestAnimationFrame(() => {
          if (ytPendingPosition) setYtPosition(ytPendingPosition.x, ytPendingPosition.y, false);
          ytPendingPosition = null;
          ytMoveFrame = 0;
        });
      }
      e.preventDefault();
    }

    function endYtDrag(e) {
      if (!ytDrag || e.pointerId !== ytDrag.pointerId) return;
      ytDrag = null;
      if (ytMoveFrame) cancelAnimationFrame(ytMoveFrame);
      if (ytPendingPosition) setYtPosition(ytPendingPosition.x, ytPendingPosition.y, false);
      ytPendingPosition = null;
      ytMoveFrame = 0;
      els.ytHost.classList.remove("is-dragging");
      snapYtToNearestEdge();
    }

    function minimizeInterface() {
      document.body.classList.add("is-minimal");
      closeYoutubeWindow();
    }

    function restoreInterface() {
      document.body.classList.remove("is-minimal");
    }

    function closeYoutubeWindow() {
      if (ytPlayerClosed) return;
      ytPlayerClosed = true;
      els.ytHost.classList.add("is-closing");
      els.screenOpen.classList.add("is-video-closed");
      els.screenOpen.textContent = "▶ Show video";
      setTimeout(() => {
        if (!ytPlayerClosed) return;
        els.ytHost.style.display = "none";
        els.ytHost.classList.remove("is-closing");
      }, 260);
    }

    function openYoutubeWindow() {
      els.ytHost.style.display = "block";
      ytPlayerClosed = false;
      els.screenOpen.classList.remove("is-video-closed");
      els.screenOpen.textContent = "↗ Open";
      els.ytHost.classList.add("is-opening");
      requestAnimationFrame(() => {
        snapYtToNearestEdge();
        requestAnimationFrame(() => els.ytHost.classList.remove("is-opening"));
      });
    }

    function openBgDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(BG_DB, 1);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(BG_STORE)) {
            req.result.createObjectStore(BG_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function withBgStore(mode, run) {
      const db = await openBgDb();
      try {
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(BG_STORE, mode);
          const req = run(tx.objectStore(BG_STORE));
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => reject(req.error);
          tx.onerror = () => reject(tx.error);
        });
      } finally {
        db.close();
      }
    }

    const saveBgBlob = (blob) => withBgStore("readwrite", (s) => s.put(blob, "custom"));
    const loadBgBlob = () => withBgStore("readonly", (s) => s.get("custom"));
    const clearBgBlob = () => withBgStore("readwrite", (s) => s.delete("custom"));

    function setDefaultBackground() {
      if (customBgUrl) {
        URL.revokeObjectURL(customBgUrl);
        customBgUrl = null;
      }
      els.sceneBg.src = DEFAULT_BG;
      els.mobileBgSource.srcset = "./assets/Kishore_Kumar_mobile.png";
      els.scene.style.setProperty("--scene-image", `url("${DEFAULT_BG}")`);
      els.resetBg.hidden = true;
    }

    function setCustomBackground(blob) {
      if (customBgUrl) URL.revokeObjectURL(customBgUrl);
      customBgUrl = URL.createObjectURL(blob);
      els.sceneBg.src = customBgUrl;
      els.mobileBgSource.srcset = customBgUrl;
      els.scene.style.setProperty("--scene-image", `url("${customBgUrl}")`);
      els.resetBg.hidden = false;
    }

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          const scale = Math.min(1, MAX_BG_EDGE / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(
            (blob) => (blob ? resolve(blob) : reject(new Error("compress failed"))),
            "image/jpeg",
            0.85
          );
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("invalid image"));
        };
        img.src = url;
      });
    }

    async function restoreCustomBackground() {
      try {
        const blob = await loadBgBlob();
        if (blob) setCustomBackground(blob);
        else setDefaultBackground();
      } catch {
        setDefaultBackground();
      }
    }

    function updateClock() {
      els.clock.textContent = new Date()
        .toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
        .toLowerCase();
    }

    function setPlaying(isPlaying) {
      els.play.classList.toggle("is-playing", isPlaying);
      els.play.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
      els.art.classList.toggle("is-spinning", isPlaying);
    }

    function setProgress(current, duration) {
      const pct = duration > 0 ? (current / duration) * 100 : 0;
      els.progressFill.style.width = `${pct}%`;
      els.progressKnob.style.left = `${pct}%`;
      els.progress.setAttribute("aria-valuenow", String(Math.round(pct)));
    }

    function cleanArtistName(name) {
      return String(name || "")
        .replace(/\s*-\s*Topic\s*$/i, "")
        .trim() || "YouTube Music";
    }

    function refreshMeta() {
      if (!player?.getVideoData) return;
      const data = player.getVideoData() || {};
      const title = data.title || "Untitled track";
      const artist = cleanArtistName(data.author);
      const videoId = data.video_id;

      els.title.textContent = title;
      els.artist.textContent = artist;
      document.title = `${title} · KISHOREVERSE`;

      if (videoId) {
        els.art.src = `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`;
        els.art.alt = `Cover for ${title}`;
      }
    }

    function tick() {
      if (!player || seeking) return;
      setProgress(player.getCurrentTime?.() ?? 0, player.getDuration?.() ?? 0);
    }

    function seekFromClientX(clientX) {
      if (!player || !ready) return;
      const rect = els.progress.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const duration = player.getDuration?.() ?? 0;
      const target = duration * ratio;
      setProgress(target, duration);
      return target;
    }

    function playlistLength() {
      return player?.getPlaylist?.()?.length ?? 0;
    }

    function movePlaylist(step, attempt = 0) {
      if (!player || !ready || currentSource.type !== "playlist") return;
      const playlist = player.getPlaylist?.() || [];
      if (!playlist.length) {
        if (attempt < 10) {
          setTimeout(() => movePlaylist(step, attempt + 1), 300);
        } else {
          els.title.textContent = "Playlist is still loading…";
        }
        return;
      }

      const index = player.getPlaylistIndex?.() ?? 0;
      const nextIndex = (index + step + playlist.length) % playlist.length;
      wantPlay = true;
      player.playVideoAt(nextIndex);
      setTimeout(() => {
        if (wantPlay) tryPlay();
      }, 300);
    }

    function parseYouTubeInput(raw) {
      const value = String(raw || "").trim();
      if (!value) return null;
      if (/^(PL|OL|UU|LL|RD|SD)[\w-]{10,}$/i.test(value)) return { type: "playlist", id: value };
      if (/^[\w-]{11}$/.test(value)) return { type: "video", id: value };

      let url;
      try {
        url = new URL(value);
      } catch {
        return null;
      }

      const host = url.hostname.replace(/^www\./, "");
      const list = url.searchParams.get("list")?.trim();
      const video =
        url.searchParams.get("v") ||
        (host === "youtu.be" ? url.pathname.slice(1).split("/")[0] : null) ||
        (url.pathname.startsWith("/shorts/") ? url.pathname.split("/")[2] : null) ||
        (url.pathname.startsWith("/embed/") ? url.pathname.split("/")[2] : null);

      if (list && /^[\w-]{10,}$/.test(list)) return { type: "playlist", id: list };
      if (video && /^[\w-]{11}$/.test(video)) return { type: "video", id: video };
      return null;
    }

    function rememberSource(source, displayValue) {
      currentSource = source;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ source, displayValue }));
    }

    function showDetailedPlayError(code) {
      const reasons = {
        2: "The YouTube request is invalid",
        5: "The video cannot be played in this HTML5 player",
        100: "This playlist item is unavailable or private",
        101: "This playlist item does not allow embedding",
        150: "This playlist item does not allow embedding",
        153: "YouTube could not verify the video request",
      };
      const reason = reasons[code] || "YouTube did not provide a playback reason";
      const sourceLabel = currentSource.type === "playlist" ? "playlist" : "video";
      els.title.textContent = `Unable to load ${sourceLabel}`;
      els.artist.textContent = `${reason} (error ${code ?? "unknown"})`;
      setPlaying(false);
      wantPlay = false;
    }

    function showPlayError(code) {
      const blocked = code === 101 || code === 150;
      const unavailable = code === 100;
      els.title.textContent = blocked
        ? "Skipped a non-embeddable song"
        : unavailable
          ? "Skipped an unavailable song"
          : "Couldn’t play that link";
      els.artist.textContent = blocked || unavailable
        ? "KISHOREVERSE is trying the next song in this playlist…"
        : "Paste a public YouTube playlist or song URL";
      setPlaying(false);
    }

    function resetPlaylistRecovery() {
      playlistFailedIndexes.clear();
      if (playlistRecoveryTimer) {
        clearTimeout(playlistRecoveryTimer);
        playlistRecoveryTimer = null;
      }
    }

    function playlistCandidateIndexes(length, currentIndex) {
      const candidates = [];
      for (let offset = 1; offset <= length; offset += 1) {
        const candidate = (currentIndex + offset) % length;
        if (!playlistFailedIndexes.has(candidate)) candidates.push(candidate);
      }
      return candidates;
    }

    function recoverFromPlaylistError(code, failedIndex, token) {
      if (currentSource.type !== "playlist" || token !== playlistLoadToken) return false;

      const playlist = player?.getPlaylist?.() || [];
      const length = playlist.length;
      const index = Number.isInteger(failedIndex) && failedIndex >= 0 ? failedIndex : 0;
      playlistFailedIndexes.add(index);

      showPlayError(code);

      // Prefer playVideoAt() because it works with the playlist indices
      // returned by the IFrame API. Fall back to nextVideo() if YouTube has
      // not exposed the playlist array yet.
      if (length > 0) {
        const candidates = playlistCandidateIndexes(length, index);
        if (!candidates.length) {
          showDetailedPlayError(code);
          return false;
        }

        const nextIndex = candidates[0];
        playlistRecoveryTimer = setTimeout(() => {
          playlistRecoveryTimer = null;
          try {
            player.playVideoAt(nextIndex);
            if (wantPlay) {
              setTimeout(() => tryPlay(), 180);
            }
          } catch {
            try { player.nextVideo(); } catch { /* ignore */ }
          }
        }, 300);
        return true;
      }

      if (playlistFailedIndexes.size < 25) {
        playlistRecoveryTimer = setTimeout(() => {
          playlistRecoveryTimer = null;
          try {
            player.nextVideo();
            if (wantPlay) setTimeout(() => tryPlay(), 180);
          } catch { /* ignore */ }
        }, 300);
        return true;
      }

      showDetailedPlayError(code);
      return false;
    }

    function tryPlay() {
      if (!player || !ready) return;
      wantPlay = true;
      try {
        const state = player.getPlayerState();
        if (state === YT.PlayerState.CUED || state === YT.PlayerState.PAUSED || state === YT.PlayerState.UNSTARTED) {
          player.playVideo();
        } else if (state === YT.PlayerState.PLAYING) {
          /* already playing */
        } else {
          player.playVideo();
        }
      } catch {
        /* ignore */
      }
    }

    function loadSource(source, { autoplay = true } = {}) {
      if (!player || !ready) return false;

      playlistLoadToken += 1;
      resetPlaylistRecovery();
      wantPlay = autoplay;
      setProgress(0, 0);
      setPlaying(false);
      els.artist.textContent = "YouTube Music · Press Play to start";

      if (source.type === "playlist") {
        els.title.textContent = "Loading playlist…";
        const payload = {
          listType: "playlist",
          list: source.id,
        };
        try {
          if (autoplay) player.loadPlaylist(payload);
          else player.cuePlaylist(payload);
        } catch {
          if (autoplay) player.loadPlaylist(source.id);
          else player.cuePlaylist(source.id);
        }
        if (!autoplay) {
          setTimeout(() => {
            if (playlistLength() > 0) {
              try {
                player.playVideoAt(0);
                player.pauseVideo();
                refreshMeta();
                els.artist.textContent = "Ready · press ▶ Play";
              } catch { /* YouTube still loading */ }
            }
          }, 900);
        }
        if (autoplay) {
          // Start immediately from the user's Load/playlist-button gesture.
          // The delayed call is a fallback while YouTube finishes loading
          // the playlist metadata.
          tryPlay();
          setTimeout(() => {
            if (wantPlay) tryPlay();
          }, 900);
        }
        const loadToken = playlistLoadToken;
        setTimeout(() => {
          if (loadToken === playlistLoadToken && currentSource.id === source.id && els.title.textContent === "Loading playlist…") {
            showDetailedPlayError(2);
          }
        }, 10000);
      } else {
        els.title.textContent = "Loading song…";
        if (autoplay) player.loadVideoById(source.id);
        else player.cueVideoById(source.id);
      }

      return true;
    }

    function onPlayerReady() {
      ready = true;
      setInterval(tick, 250);

      if (pendingSource?.id) {
        currentSource = pendingSource;
        pendingSource = null;
        els.input.value = currentSource.id === BENGALI_PLAYLIST
          ? BENGALI_PLAYLIST_URL
          : DEFAULT_PLAYLIST_URL;
      } else {
        currentSource = { type: "playlist", id: DEFAULT_PLAYLIST };
        els.input.value = DEFAULT_PLAYLIST_URL;
      }

      // Cue the remembered/default playlist without starting playback.
      // Playback begins from the visible Play button, which is a direct user gesture.
      loadSource(currentSource, { autoplay: false });
      refreshMeta();
      tick();
    }

    function onPlayerStateChange(event) {
      const { PLAYING, PAUSED, ENDED, CUED, BUFFERING } = YT.PlayerState;

      if (event.data === PLAYING) {
        // A successful track means playlist recovery can start fresh.
        playlistFailedIndexes.clear();
        setPlaying(true);
        refreshMeta();
      } else if (event.data === PAUSED) {
        setPlaying(false);
      } else if (event.data === ENDED) {
        setPlaying(false);
        if (currentSource.type === "playlist" && playlistLength() > 0) {
          player.playVideoAt(0);
        } else if (currentSource.type === "video") {
          player.seekTo(0, true);
          player.playVideo();
        }
      } else if (event.data === CUED) {
        refreshMeta();
        tick();
        if (wantPlay) tryPlay();
      }
    }

    function onPlayerError(event) {
      const code = event?.data;
      const index = player.getPlaylistIndex?.() ?? 0;

      // 100 = unavailable/private, 101/150 = embedding disabled. These
      // errors can affect only one item in a playlist, so do not kill the
      // whole Bengali/Hindi playlist. Move forward until a playable item
      // is found.
      if (currentSource.type === "playlist" && [100, 101, 150].includes(code)) {
        recoverFromPlaylistError(code, index, playlistLoadToken);
        return;
      }

      showDetailedPlayError(code);
    }

    function createPlayer() {
      const playerVars = {
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        fs: 0,
        playsinline: 1,
        rel: 0,
        enablejsapi: 1,
        iv_load_policy: 3,
      };
      if (window.location.protocol.startsWith("http")) {
        playerVars.origin = window.location.origin;
        playerVars.widget_referrer = window.location.href;
      }

      player = new YT.Player("yt-api-host", {
        height: "180",
        width: "320",
        host: YOUTUBE_PLAYER_HOST,
        playerVars,
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError,
        },
      });
    }

    els.bgInput.addEventListener("change", async () => {
      const file = els.bgInput.files?.[0];
      els.bgInput.value = "";
      if (!file?.type.startsWith("image/")) return;
      try {
        const blob = await compressImageFile(file);
        await saveBgBlob(blob);
        setCustomBackground(blob);
      } catch {
        /* keep current background */
      }
    });

    els.resetBg.addEventListener("click", async () => {
      try { await clearBgBlob(); } catch { /* ignore */ }
      setDefaultBackground();
    });

    function loadNamedPlaylist(id, url, autoplay = false) {
      const source = { type: "playlist", id };
      els.input.value = url;
      rememberSource(source, url);
      if (!loadSource(source, { autoplay })) {
        pendingSource = source;
        els.title.textContent = "Loading playlist…";
        els.artist.textContent = "Starting the YouTube player";
      }
    }

    els.loadHindi.addEventListener("click", () => {
      loadNamedPlaylist(DEFAULT_PLAYLIST, DEFAULT_PLAYLIST_URL, false);
    });

    els.loadBengali.addEventListener("click", () => {
      loadNamedPlaylist(BENGALI_PLAYLIST, BENGALI_PLAYLIST_URL, false);
    });

    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const parsed = parseYouTubeInput(els.input.value);
      if (!parsed) {
        els.title.textContent = "Invalid YouTube link";
        els.artist.textContent = "Paste a playlist or song URL";
        return;
      }
      rememberSource(parsed, els.input.value.trim());
      if (!loadSource(parsed, { autoplay: false })) {
        els.title.textContent = "Player still loading…";
        els.artist.textContent = "Try again in a second";
      }
    });

    els.play.addEventListener("click", () => {
      if (!player || !ready) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        wantPlay = false;
        player.pauseVideo();
      } else {
        tryPlay();
      }
    });

    els.prev.addEventListener("click", () => {
      if (!player || !ready) return;
      if (currentSource.type !== "playlist") {
        player.seekTo(0, true);
        return;
      }
      movePlaylist(-1);
    });

    els.next.addEventListener("click", () => {
      if (!player || !ready) return;
      if (currentSource.type !== "playlist") {
        player.seekTo(0, true);
        player.playVideo();
        return;
      }
      movePlaylist(1);
    });

    els.progress.addEventListener("pointerdown", (e) => {
      if (!ready) return;
      els.progress.setPointerCapture(e.pointerId);
      seeking = true;
      els.progress.classList.add("is-dragging");
      seekFromClientX(e.clientX);
    });

    els.progress.addEventListener("pointermove", (e) => {
      if (seeking) seekFromClientX(e.clientX);
    });

    function endSeek(e) {
      if (!seeking) return;
      const target = seekFromClientX(e.clientX);
      if (typeof target === "number") player.seekTo(target, true);
      seeking = false;
      els.progress.classList.remove("is-dragging");
    }

    els.progress.addEventListener("pointerup", endSeek);
    els.progress.addEventListener("pointercancel", endSeek);

    els.progress.addEventListener("keydown", (e) => {
      if (!player || !ready) return;
      const duration = player.getDuration?.() ?? 0;
      const current = player.getCurrentTime?.() ?? 0;
      let next = current;
      if (e.key === "ArrowRight") next = Math.min(duration, current + 5);
      else if (e.key === "ArrowLeft") next = Math.max(0, current - 5);
      else return;
      e.preventDefault();
      player.seekTo(next, true);
      setProgress(next, duration);
    });

    els.ytDragHandle.addEventListener("pointerdown", startYtDrag);
    els.ytDragHandle.addEventListener("pointermove", moveYtDrag);
    els.ytDragHandle.addEventListener("pointerup", endYtDrag);
    els.ytDragHandle.addEventListener("pointercancel", endYtDrag);

    els.ytWindowClose.addEventListener("click", closeYoutubeWindow);
    els.screenClose.addEventListener("click", minimizeInterface);
    els.screenOpen.addEventListener("click", () => {
      if (ytPlayerClosed) openYoutubeWindow();
    });
    els.screenAll.addEventListener("click", () => {
      restoreInterface();
      if (ytPlayerClosed) openYoutubeWindow();
    });

    window.addEventListener("resize", () => {
      if (els.ytHost.style.display !== "none") snapYtToNearestEdge();
    });

    restoreCustomBackground();
    updateClock();
    setInterval(updateClock, 15000);

    window.onYouTubeIframeAPIReady = createPlayer;
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  </script>
</body>
</html>
